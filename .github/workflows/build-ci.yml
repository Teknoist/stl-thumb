name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows Validation
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    - uses: Swatinem/rust-cache@v2
    - name: Check formatting
      run: cargo fmt --all -- --check
    - name: Build all targets
      run: cargo check --all-targets
    - name: Lint all targets
      run: cargo clippy --all-targets -- -D warnings
    - name: Run non-graphics tests
      run: cargo test mesh::tests
    - name: Validate SMB policy script
      shell: pwsh
      run: |
        $errors = $null
        [void][System.Management.Automation.Language.Parser]::ParseFile(
          (Resolve-Path 'scripts/Set-SmbThumbnailPolicy.ps1'),
          [ref]$null,
          [ref]$errors
        )
        if ($errors.Count -gt 0) { throw ($errors | Out-String) }
        ./scripts/Set-SmbThumbnailPolicy.ps1 -Mode Status
        try {
          ./scripts/Set-SmbThumbnailPolicy.ps1 -Mode Status -CleanupPath . -WhatIf
          throw 'The cleanup guard accepted a local path.'
        }
        catch {
          if ($_ -notmatch 'Refusing to clean a local path') { throw }
        }

  build:
    name: Build and Test
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-buildtest-cargo-${{ hashFiles('**/Cargo.lock') }}
    - name: Install packages
      run: |
        sudo apt-get update
        sudo apt-get install libosmesa6-dev
    - name: Build
      run: |
        cargo fmt --all -- --check
        cargo build --release --verbose
        strip -s target/release/stl-thumb
    - name: Run tests
      run: RUST_BACKTRACE=1 cargo test --verbose

  package:
    needs: [build]
    name: Package
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        include:
        - target: x86_64-unknown-linux-gnu
          apt_arch: amd64
          packages: libfreetype6-dev libfontconfig-dev
          pkg_config_libdir: /usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig
        - target: armv7-unknown-linux-gnueabihf
          apt_arch: armhf
          packages: gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf libc-dev-armhf-cross libfreetype6-dev:armhf libfontconfig-dev:armhf
          pkg_config_libdir: /usr/lib/arm-linux-gnueabihf/pkgconfig:/usr/share/pkgconfig
        - target: aarch64-unknown-linux-gnu
          apt_arch: arm64
          packages: gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libc-dev-arm64-cross libfreetype6-dev:arm64 libfontconfig-dev:arm64
          pkg_config_libdir: /usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
    steps:
    - uses: actions/checkout@v4
    - uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    - name: Install packages
      run: |
        sudo cp .github/workflows/sources.list /etc/apt/sources.list
        if [ "${{ matrix.apt_arch }}" != "amd64" ]; then
          sudo dpkg --add-architecture ${{ matrix.apt_arch }}
        fi
        sudo apt-get update
        sudo apt-get install ${{ matrix.packages }}
    - name: Prep build environment
      run: |
        rustup target add ${{ matrix.target }}
        cargo install cargo-deb --version 3.7.0 --locked
        cargo install cargo-generate-rpm --version 0.21.0 --locked
    - name: Package DEB
      env:
        PKG_CONFIG_ALLOW_CROSS: 1
        PKG_CONFIG_LIBDIR: ${{ matrix.pkg_config_libdir }}
      run: cargo deb --target ${{ matrix.target }}
    - name: Package RPM
      env:
        PKG_CONFIG_ALLOW_CROSS: 1
        PKG_CONFIG_LIBDIR: ${{ matrix.pkg_config_libdir }}
      run: |
        cargo build --release --target ${{ matrix.target }}
        cargo generate-rpm --target-dir ./target --target ${{ matrix.target }}
    - uses: actions/upload-artifact@v4
      with:
        name: deb-rpm-${{ matrix.target }}
        path: |
          target/${{ matrix.target }}/debian/*.deb
          target/${{ matrix.target }}/generate-rpm/*.rpm
