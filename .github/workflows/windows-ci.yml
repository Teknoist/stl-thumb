name: Windows CI

on:
  push:
    branches:
      - master
      - windows-ci
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest

    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: windows-x64-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            windows-x64-cargo-

      - name: Show toolchain
        shell: pwsh
        run: |
          rustc -Vv
          cargo -V

      - name: Build release binary
        run: cargo build --release --target x86_64-pc-windows-msvc --verbose

      - name: Smoke test CLI
        shell: pwsh
        run: |
          $exe = "target/x86_64-pc-windows-msvc/release/stl-thumb.exe"
          if (!(Test-Path $exe)) { throw "Missing $exe" }
          & $exe --help
          & $exe --version

      - name: Package portable zip
        shell: pwsh
        run: |
          ./scripts/windows/package-release.ps1 `
            -BinaryPath "target/x86_64-pc-windows-msvc/release/stl-thumb.exe" `
            -OutputDir "dist" `
            -PackageName "stl-thumb-windows-x64"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: stl-thumb-windows-x64
          path: dist/stl-thumb-windows-x64.zip
          if-no-files-found: error
